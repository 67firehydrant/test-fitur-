---
name: 🧑 Karakter Baru
description: Tambahkan karakter baru ke Swaraloka
labels: ["character", "wip"]
title: "🧑 [Nama Karakter]"
body:
  - type: markdown
    attributes:
      value: |
        ## Template Karakter Swaraloka
        Isi informasi karakter di bawah ini. Semua field bersifat opsional — bisa diisi nanti.
  - type: input
    id: nama
    attributes:
      label: Nama
      description: Nama karakter
      placeholder: "contoh: Raden Wibawa"
    validations:
      required: true
  - type: input
    id: julukan
    attributes:
      label: Julukan / Gelar
      placeholder: "contoh: Sang Penyanyi Badai"
  - type: dropdown
    id: ras
    attributes:
      label: Ras
      options:
        - Manusia
        - Naga
        - Makhluk Hutan
        - Makhluk Lautan
        - Makhluk Langit
        - Makhluk Kegelapan
        - Lainnya
  - type: dropdown
    id: peran
    attributes:
      label: Peran
      options:
        - 🦸 Pahlawan
        - 🦹 Penjahat
        - 🧙 Bijaksana
        - 🎭 Netral
        - 👤 Pendukung
  - type: input
    id: faksi
    attributes:
      label: Faksi
      placeholder: "Kerajaan / organisasi yang diikuti"
  - type: textarea
    id: mantra
    attributes:
      label: Mantra
      description: Jenis & kekuatan mantra yang dimiliki
      placeholder: "contoh: Mantra Ucapan — bisa mengendalikan angin dengan suara"
  - type: textarea
    id: penampilan
    attributes:
      label: Penampilan
      description: Deskripsi fisik karakter
      placeholder: "Tinggi, rambut hitam panjang, mata berwarna perak..."
  - type: textarea
    id: kepribadian
    attributes:
      label: Kepribadian
      description: Sifat & karakter
      placeholder: "Pemberani tapi impulsif, setia pada teman..."
  - type: textarea
    id: latar_belakang
    attributes:
      label: Latar Belakang
      description: Sejarah masa lalu karakter
      placeholder: "Dibesarkan di kuil terpencil..."
  - type: textarea
    id: motivasi
    attributes:
      label: Motivasi
      description: Apa yang mendorong karakter ini
      placeholder: "Mencari nyanyian yang hilang dari ibunya..."
  - type: textarea
    id: rahasia
    attributes:
      label: Rahasia
      description: Hal yang disembunyikan karakter
      placeholder: "Sebenarnya keturunan Naga..."
  - type: textarea
    id: quote
    attributes:
      label: Quote Ikonik
      description: Kata-kata yang mewakili karakter
      placeholder: '"Dengarkan nyanyian angin — ia bercerita tentang kita."'
