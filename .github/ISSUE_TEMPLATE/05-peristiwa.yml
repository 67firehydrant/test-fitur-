---
name: 📜 Peristiwa Sejarah
description: Tambahkan peristiwa ke timeline Swaraloka
labels: ["event", "wip"]
title: "📜 [Nama Peristiwa]"
body:
  - type: input
    id: nama
    attributes:
      label: Nama Peristiwa
      placeholder: "contoh: Perang Mantra Agung"
    validations:
      required: true
  - type: dropdown
    id: era
    attributes:
      label: Era
      options:
        - Era Swara Mula (-10000 s.d. -8000)
        - Era Kejayaan (-8000 s.d. -5000)
        - Era Pemisahan (-5000 s.d. -3000)
        - Era Kerajaan (-3000 s.d. -1000)
        - Era Perang Mantra (-1000 s.d. -500)
        - Era Perdamaian (-500 s.d. 0)
        - Era Keheningan (0 s.d. sekarang)
  - type: dropdown
    id: tipe
    attributes:
      label: Tipe Peristiwa
      options:
        - ⚔️ Perang
        - 📜 Perjanjian
        - 🌋 Bencana
        - 🔮 Penemuan
        - 🌅 Kebangkitan
        - 💀 Kematian penting
        - 🏗️ Pembangunan
        - Lainnya
  - type: textarea
    id: deskripsi
    attributes:
      label: Deskripsi
      description: Apa yang terjadi
  - type: textarea
    id: faksi_terlibat
    attributes:
      label: Faksi Terlibat
      description: Siapa yang terlibat
  - type: textarea
    id: karakter_kunci
    attributes:
      label: Karakter Kunci
      description: Tokoh penting dalam peristiwa
  - type: textarea
    id: dampak
    attributes:
      label: Dampak
      description: Konsekuensi jangka panjang
