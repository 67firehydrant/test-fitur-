---
name: 💎 Artefak Baru
description: Tambahkan artefak/benda pusaka ke Swaraloka
labels: ["artifact", "wip"]
title: "💎 [Nama Artefak]"
body:
  - type: input
    id: nama
    attributes:
      label: Nama Artefak
      placeholder: "contoh: Keris Naga Sembada"
    validations:
      required: true
  - type: dropdown
    id: tipe
    attributes:
      label: Tipe
      options:
        - ⚔️ Senjata
        - 🛡️ Pelindung
        - 📿 Perhiasan
        - 📜 Gulungan
        - 🎵 Instrumen
        - 🏺 Pusaka
        - 💎 Manik-Manik
        - Lainnya
  - type: textarea
    id: asal
    attributes:
      label: Asal
      description: Siapa yang membuat, di mana
  - type: textarea
    id: mantra
    attributes:
      label: Mantra
      description: Mantra yang terkandung dalam artefak
  - type: textarea
    id: kekuatan
    attributes:
      label: Kekuatan
      description: Apa yang bisa dilakukan artefak ini
  - type: textarea
    id: kelemahan
    attributes:
      label: Kelemahan / Kutukan
      description: Batasan atau efek samping
  - type: textarea
    id: pemilik
    attributes:
      label: Pemilik
      description: Siapa yang memegang saat ini & sejarah kepemilikan
  - type: textarea
    id: lore
    attributes:
      label: Lore
      description: Cerita & sejarah artefak
