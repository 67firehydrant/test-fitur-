---
name: 🎵 Lore Umum
description: Tambahkan lore, pengetahuan, atau detail dunia
labels: ["lore", "wip"]
title: "🎵 [Judul Lore]"
body:
  - type: input
    id: judul
    attributes:
      label: Judul
      placeholder: "contoh: Legenda Pohon Kalpawrksa"
    validations:
      required: true
  - type: dropdown
    id: kategori
    attributes:
      label: Kategori
      options:
        - 🌌 Kosmologi
        - 🗺️ Geografi
        - ⚔️ Faksi
        - 🧑 Karakter
        - 🐉 Spesies
        - 📜 Sejarah
        - 🎭 Budaya
        - 💎 Artefak
        - Lainnya
  - type: textarea
    id: konten
    attributes:
      label: Konten
      description: Tulis lore di sini
      placeholder: "Dahulu kala, di puncak gunung tertinggi..."
  - type: textarea
    id: referensi
    attributes:
      label: Referensi / Terkait
      description: Link ke halaman lain yang terkait
